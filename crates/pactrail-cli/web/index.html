<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#F4F3EE"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121311"
      media="(prefers-color-scheme: dark)"
    />
    <title>Pactrail</title>
    <script src="/boot.js"></script>
    <link
      rel="preload"
      href="/fonts/ibm-plex-sans-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/ibm-plex-mono-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/app.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="app-shell" id="app">
      <aside class="rail" id="rail" aria-label="Run history">
        <div class="rail-head">
          <a class="wordmark" href="/" data-link
            ><svg class="rail-logo" viewBox="0 0 16 20" aria-hidden="true">
              <path d="M8 2v16" />
              <circle cx="8" cy="3" r="2" />
              <circle cx="8" cy="10" r="2" />
              <circle cx="8" cy="17" r="2" /></svg
            ><span>pactrail</span></a
          ><button
            class="icon-button"
            id="rail-toggle"
            aria-label="Collapse run history"
            title="Collapse run history"
          >
            ‹
          </button>
        </div>
        <button
          class="workspace-chip mono"
          id="workspace-copy"
          title="Copy workspace path"
        >
          Connecting…
        </button>
        <a class="new-run button primary" href="/" data-link
          ><span>＋</span><span class="rail-label">New run</span><kbd>N</kbd></a
        >
        <label class="rail-search"
          ><span class="sr-only">Search runs</span
          ><input
            id="rail-search"
            type="search"
            placeholder="Search runs ⌘K"
            autocomplete="off"
        /></label>
        <div id="rail-filters" class="segments" aria-label="Filter runs"></div>
        <select
          id="rail-filter-select"
          aria-label="Filter runs"
          hidden
        ></select>
        <nav id="run-list" aria-label="Runs">
          <p class="muted rail-empty">Connecting to the engine…</p>
        </nav>
        <footer class="rail-footer">
          <span id="engine-indicator" class="caption">Connecting…</span
          ><a
            href="/settings"
            data-link
            class="settings-link"
            aria-label="Settings"
            ><span aria-hidden="true">⚙</span
            ><span class="rail-label">Settings</span></a
          >
        </footer>
      </aside>
      <button
        id="rail-scrim"
        class="scrim"
        aria-label="Close run history"
        hidden
      ></button>
      <div class="work-area">
        <header class="app-bar">
          <button
            class="icon-button"
            id="open-rail"
            aria-label="Open runs"
            title="Open runs"
          >
            ☰</button
          ><span id="breadcrumb">New task</span><span class="bar-spacer"></span
          ><span
            class="connection-dot"
            id="connection-dot"
            title="Connecting"
            aria-label="Connecting"
          ></span
          ><a
            class="icon-button"
            href="/"
            data-link
            aria-label="New task"
            title="New task"
            >＋</a
          ><button
            class="icon-button"
            id="shortcuts"
            aria-label="Keyboard shortcuts"
            title="Keyboard shortcuts"
          >
            ?
          </button>
        </header>
        <div id="connection-banner" hidden></div>
        <main id="main" tabindex="-1"></main>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="popover" class="popover" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="alert" class="sr-only" role="alert" aria-atomic="true"></div>
  </body>
</html>
